function fit(){S=Math.min(innerWidth/W,innerHeight/H);const d=Math.min(devicePixelRatio||1,2);cv.style.cssText=`position:absolute;width:${W*S}px;height:${H*S}px;left:${(innerWidth-W*S)/2}px;top:${(innerHeight-H*S)/2}px`;cv.width=W*S*d;cv.height=H*S*d;g.setTransform(S*d,0,0,S*d,0,0)}

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

let AC=null;
function tone(f,dur,del,type,vol,f2){if(!AC)return;const t=AC.currentTime+(del||0),o=AC.createOscillator(),v=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);v.gain.setValueAtTime(vol||.12,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+dur+.02)}
function snd(k,p){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();

 if(k=='match'){const b=1+(p||0)*.06;tone(784*b,.12,0,'square',.05);tone(1046*b,.12,.07,'square',.05);tone(1568*b,.22,.14,'square',.05)}
 if(k=='win')[523,659,784,1046,1318].forEach((f,i)=>tone(f,.3,i*.09,'square',.05));
 if(k=='fail')[392,330,262].forEach((f,i)=>tone(f,.25,i*.14,'triangle',.1))}catch(e){}}

function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

 g.lineJoin='round';g.lineWidth=size*.24;g.strokeStyle=stroke||CFG.ink||'#2a0f6b';g.strokeText(t,0,size*.07);g.strokeText(t,0,0);g.fillStyle=fill;g.fillText(t,0,0);g.restore()}

 if(press>.15){g.save();g.globalAlpha=.85*press;g.strokeStyle='#fff';g.lineWidth=4*k;g.beginPath();g.arc(x,y,(10+press*16)*k,0,7);g.stroke();
  g.globalAlpha=.35*press;g.fillStyle='#fff';g.beginPath();g.arc(x,y,(8+press*6)*k,0,7);g.fill();g.restore()}

function K_start(cfg){CFG=cfg;bokeh=[...Array(14)].map(()=>({x:Math.random()*W,y:Math.random()*H,r:20+Math.random()*50,v:4+Math.random()*8}));buildDom();
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/S,(e.clientY-r.top)/S]};let isDown=false;

 if(t==0){g.fillStyle=shade(x,y,r,'#ff7a7a','#c8142b');g.beginPath();g.moveTo(x,y-r*.62);g.bezierCurveTo(x+r*.6,y-r*1.05,x+r*1.12,y-r*.4,x+r*.95,y+r*.25);g.bezierCurveTo(x+r*.8,y+r*.85,x+r*.35,y+r*1.02,x,y+r*.82);g.bezierCurveTo(x-r*.35,y+r*1.02,x-r*.8,y+r*.85,x-r*.95,y+r*.25);g.bezierCurveTo(x-r*1.12,y-r*.4,x-r*.6,y-r*1.05,x,y-r*.62);g.fill();g.stroke();
  g.strokeStyle='#6b3b16';g.lineWidth=2.5;g.beginPath();g.moveTo(x,y-r*.6);g.quadraticCurveTo(x+r*.05,y-r*.95,x+r*.15,y-r*1.05);g.stroke();leaf(x+r*.1,y-r*.85,r,-.5);shine(x,y,r)}
 if(t==1){g.fillStyle=shade(x,y,r,'#ffc266','#f07b00');circ(x,y,r*.92);g.fill();g.stroke();g.fillStyle='rgba(180,80,0,.25)';for(let i=0;i<9;i++){circ(x+Math.cos(i*2.4)*r*.55,y+Math.sin(i*2.4)*r*.5,1.3);g.fill()}leaf(x,y-r*.85,r,-.3);shine(x,y,r)}
 if(t==2){g.save();g.translate(x,y);g.rotate(-.5);g.fillStyle=shade(0,0,r,'#fff38a','#e9c400');g.beginPath();g.ellipse(0,0,r,r*.72,0,0,7);g.fill();g.stroke();g.beginPath();g.ellipse(r*.98,0,r*.16,r*.12,0,0,7);g.fill();g.stroke();g.restore();shine(x,y,r*.9)}
 if(t==3){g.fillStyle=shade(x,y,r,'#f3c27a','#c47d32');circ(x,y,r*.95);g.fill();g.stroke();g.fillStyle='#ff6fae';g.beginPath();for(let i=0;i<=24;i++){const a=i/24*Math.PI*2,q=r*(.8+Math.sin(i*1.7)*.05);g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}g.fill();
  const cs=['#fff','#4cc3ff','#ffd23f','#7dffb2'];for(let i=0;i<10;i++){const a=i*.63,q=r*(.5+(i%3)*.1);g.save();g.translate(x+Math.cos(a)*q,y+Math.sin(a)*q);g.rotate(a*3);g.fillStyle=cs[i%4];g.fillRect(-3,-1,6,2.4);g.restore()}
  g.fillStyle='#3b1d5a';circ(x,y,r*.28);g.fill();g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(x-r*.4,y-r*.45,r*.2,r*.1,-.6,0,7);g.fill()}
 if(t==4){const P=[[0,.55],[-.36,.2],[.36,.2],[-.55,-.2],[0,-.18],[.55,-.2],[-.28,-.55],[.28,-.55]];for(const[a,b]of P){g.fillStyle=shade(x+a*r,y+b*r,r*.34,'#d39bff','#7a2fd0');circ(x+a*r,y+b*r,r*.33);g.fill();g.stroke()}
  for(const[a,b]of P){g.fillStyle='rgba(255,255,255,.5)';circ(x+a*r-r*.1,y+b*r-r*.1,r*.08);g.fill()}leaf(x,y-r*.82,r,-.9)}
 if(t==5){g.fillStyle=shade(x,y,r,'#ff6b7f','#d1122f');g.beginPath();g.moveTo(x,y+r);g.bezierCurveTo(x-r*.75,y+r*.55,x-r*1.05,y-r*.2,x-r*.75,y-r*.55);g.quadraticCurveTo(x,y-r*.85,x+r*.75,y-r*.55);g.bezierCurveTo(x+r*1.05,y-r*.2,x+r*.75,y+r*.55,x,y+r);g.fill();g.stroke();

const C=7,R=7,CS=46,GX=(360-C*CS)/2,GY=170,ITEM_R=18;
const GOAL={3:10,5:10};const GPOS={3:[196,548],5:[276,548]};let moves=14,busy=false,won=false,combo=0;
const rnd=rng(7);const board=[...Array(R)].map(()=>Array(C).fill(null));const flyers=[];
const px=c=>GX+c*CS+CS/2,py=r=>GY+r*CS+CS/2;
function mk(t,r,c,y0){return{t,x:px(c),y:y0??py(r),sc:y0==null?0:1,die:-1,app:y0==null?.1+(r+c)*.03:0}}
for(let r=0;r<R;r++)for(let c=0;c<C;c++){let t;do t=Math.floor(rnd()*6);while((c>1&&board[r][c-1].t==t&&board[r][c-2].t==t)||(r>1&&board[r-1][c].t==t&&board[r-2][c].t==t));board[r][c]=mk(t,r,c)}
function matches(tg){const out=new Set(),lines=[];const T_=(r,c)=>tg?tg[r][c]:board[r][c]&&board[r][c].t;
 for(let r=0;r<R;r++){let s=0;for(let c=1;c<=C;c++){if(c<C&&T_(r,c)!=null&&T_(r,c)==T_(r,s))continue;if(c-s>=3){for(let k=s;k<c;k++)out.add(r*C+k);if(c-s>=4)lines.push(['r',r])}s=c}}
 for(let c=0;c<C;c++){let s=0;for(let r=1;r<=R;r++){if(r<R&&T_(r,c)!=null&&T_(r,c)==T_(s,c))continue;if(r-s>=3){for(let k=s;k<r;k++)out.add(k*C+c);if(r-s>=4)lines.push(['c',c])}s=r}}
 if(!tg)for(const[k,i]of lines)for(let j=0;j<7;j++)out.add(k=='r'?i*C+j:j*C+i);return{out,lines}}
function bestMove(){let best=null,bs=0;const tg=board.map(row=>row.map(o=>o&&o.t));
 for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of[[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(r2>=R||c2>=C)continue;
  [tg[r][c],tg[r2][c2]]=[tg[r2][c2],tg[r][c]];const m=matches(tg);let s=0;m.out.forEach(i=>{const t=tg[Math.floor(i/C)][i%C];s+=GOAL[t]>0?3:1});s+=m.lines.length*8;
  [tg[r][c],tg[r2][c2]]=[tg[r2][c2],tg[r][c]];if(s>bs){bs=s;best={r,c,r2,c2}}}return best}
function trySwap(r,c,r2,c2){if(busy||over||r2<0||r2>=R||c2<0||c2>=C)return;busy=true;const a=board[r][c],b=board[r2][c2];board[r][c]=b;board[r2][c2]=a;snd('pick');
 after(.2,()=>{if(matches().out.size){moves--;combo=0;resolve()}else{board[r][c]=a;board[r2][c2]=b;snd('drop');after(.2,()=>busy=false)}})}
function resolve(){const m=matches();if(!m.out.size){busy=false;if(!bestMove())shuffle();if(!won&&moves<=0&&(GOAL[3]>0||GOAL[5]>0)){snd('fail');pop('OUT OF MOVES!',180,330,{big:true,c:'#ff5a6a'});finish(false,1.4)}return}

 else if(combo>1)pop(combo==2?'COMBO!':PRAISE[Math.min(combo-1,5)],180,GY+R*CS/2,{c:'#7dffb2',size:30,tag:'c'});
 m.out.forEach(i=>{const r=Math.floor(i/C),c=i%C,o=board[r][c];if(!o)return;o.die=0;burst(o.x,o.y,['#ffd23f','#ff6fae','#7dffb2','#fff','#4cc3ff','#ff8a4c'][o.t],6,150);
  if(GOAL[o.t]>0){const t=o.t;GOAL[t]--;flyers.push({t,x0:o.x,y0:o.y,t0:T+Math.random()*.1});after(.55,()=>{GPOS[t].bump=1;snd('pop',4);checkWin()})}});
 after(.24,()=>{for(let c=0;c<C;c++){let w=R-1;for(let r=R-1;r>=0;r--){const o=board[r][c];if(o&&o.die<0){board[r][c]=null;board[w][c]=o;w--}else board[r][c]=null}
  for(let r=w,k=1;r>=0;r--,k++)board[r][c]=mk(Math.floor(rnd()*6),r,c,GY-k*CS)}after(.32,resolve)})}
function checkWin(){if(won||over||GOAL[3]>0||GOAL[5]>0)return;won=true;after(.3,()=>{snd('win');pop('ORDER COMPLETE!',180,330,{big:true,size:32});for(let k=0;k<6;k++)burst(60+k*48,330,['#ffd23f','#ff6fae','#7dffb2','#4cc3ff'][k%4],14,260)});finish(true,2.4)}
function shuffle(){for(let r=0;r<R;r++)for(let c=0;c<C;c++)board[r][c].t=Math.floor(rnd()*6);if(matches().out.size||!bestMove())shuffle()}
