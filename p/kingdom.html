<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Kingdom Guard · playable demo</title>
<style>html,body{margin:0;height:100%;background:#0e1a10;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}canvas{position:absolute}
#end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,15,10,.78);color:#fff;text-align:center}
#end h1{font-size:34px;margin:0 0 8px;text-shadow:0 3px 0 #000}#end p{margin:0 0 24px;opacity:.85}
#end button{font:800 24px system-ui;padding:16px 44px;border:0;border-radius:16px;background:#3ccf4e;color:#06210b;box-shadow:0 6px 0 #1f8a2d}</style></head><body>
<canvas id="c"></canvas><div id="end"><h1 id="t"></h1><p id="s"></p><button onclick="cta()">INSTALL</button></div>
<script>
const CTA_URL='https://example.com/store';function cta(){try{if(window.mraid)return mraid.open(CTA_URL)}catch(e){}window.open(CTA_URL,'_blank')}
const W=360,H=640,cv=document.getElementById('c'),g=cv.getContext('2d');let S=1;
function fit(){S=Math.min(innerWidth/W,innerHeight/H);const d=Math.min(devicePixelRatio||1,2);cv.style.width=W*S+'px';cv.style.height=H*S+'px';cv.width=W*S*d;cv.height=H*S*d;cv.style.left=(innerWidth-W*S)/2+'px';cv.style.top=(innerHeight-H*S)/2+'px';g.setTransform(S*d,0,0,S*d,0,0)}
addEventListener('resize',fit);fit();
let joy=null,started=false;const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}};
cv.addEventListener('pointerdown',e=>{joy={o:pt(e),p:pt(e)};started=true});
addEventListener('pointermove',e=>{if(joy)joy.p=pt(e)});addEventListener('pointerup',()=>joy=null);
const P=[[250,-20],[250,110],[110,200],[110,330],[250,430],[200,570]];
const rnd=(a,b)=>a+Math.random()*(b-a);
let king={x:150,y:480,cd:0},coins=[],en=[],tw=[],shots=[],q=[],wave=0,base=5,gold=0,t=0,over=false,flash=0;
const tiles=[{x:180,y:300,c:20,b:false},{x:310,y:170,c:30,b:false}];
for(let i=0;i<26;i++){const k=Math.floor(Math.random()*(P.length-1)),a=P[k],b=P[k+1],f=Math.random();coins.push({x:a[0]+(b[0]-a[0])*f+rnd(-18,18),y:a[1]+(b[1]-a[1])*f+rnd(-18,18)})}
coins=coins.filter(c=>c.y>20);
const trees=[];for(let i=0;i<40;i++){const x=rnd(0,360),y=rnd(0,640);let ok=true;for(let k=0;k<P.length-1;k++){const a=P[k],b=P[k+1],dx=b[0]-a[0],dy=b[1]-a[1];let f=((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy);f=Math.max(0,Math.min(1,f));if(Math.hypot(x-a[0]-dx*f,y-a[1]-dy*f)<55)ok=false}if(ok)trees.push([x,y])}
function nextWave(){wave++;if(wave>3)return end(true);q=[];for(let i=0;i<4+wave*3;i++)q.push(t+1.5+i*1.1)}
function end(win){over=true;document.getElementById('t').textContent=win?'Kingdom saved!':'The gate fell!';document.getElementById('s').textContent=win?'Ready for the next level?':'One more try?';document.getElementById('end').style.display='flex'}
function near(x,y,r,list){let b=null,d=r;for(const e of list){const k=Math.hypot(e.x-x,e.y-y);if(k<d){d=k;b=e}}return b}
function shoot(o,r){if(o.cd>0)return;const e=near(o.x,o.y,r,en);if(!e)return;o.cd=o.rate;e.hp--;e.hit=.12;shots.push({a:o.x,b:o.y-14,c:e.x,d:e.y-8,l:.1});if(e.hp<=0){e.dead=1;coins.push({x:e.x,y:e.y},{x:e.x+8,y:e.y+6})}}
king.rate=.55;
function step(dt){t+=dt;if(!wave&&t>.1)nextWave();
 if(joy){const dx=joy.p.x-joy.o.x,dy=joy.p.y-joy.o.y,l=Math.hypot(dx,dy);if(l>4){const k=Math.min(l,40)/40;king.x+=dx/l*k*130*dt;king.y+=dy/l*k*130*dt}}
 king.x=Math.max(20,Math.min(340,king.x));king.y=Math.max(40,Math.min(620,king.y));king.cd-=dt;shoot(king,150);
 coins=coins.filter(c=>{if(Math.hypot(c.x-king.x,c.y-king.y)<22){gold++;return false}return true});
 for(const k of tiles)if(!k.b&&gold>=k.c&&Math.hypot(k.x-king.x,k.y-king.y)<30){gold-=k.c;k.b=true;tw.push({x:k.x,y:k.y,cd:0,rate:.8});flash=.3}
 for(const o of tw){o.cd-=dt;shoot(o,130)}
 if(q.length&&t>=q[0]){q.shift();en.push({x:P[0][0],y:P[0][1],i:1,hp:2+(wave>2?1:0),sp:rnd(32,44)})}
 for(const e of en){const [x,y]=P[e.i],dx=x-e.x,dy=y-e.y,l=Math.hypot(dx,dy);if(l<4){e.i++;if(e.i>=P.length){e.dead=1;base--;flash=.3;if(base<=0)end(false)}}else{e.x+=dx/l*e.sp*dt;e.y+=dy/l*e.sp*dt}e.hit=Math.max(0,(e.hit||0)-dt)}
 en=en.filter(e=>!e.dead);shots=shots.filter(s=>(s.l-=dt)>0);flash=Math.max(0,flash-dt);
 if(wave&&!q.length&&!en.length&&!over)nextWave()}
function txt(s,x,y,sz,col,al){g.font='800 '+sz+'px system-ui';g.textAlign=al||'center';g.lineWidth=4;g.strokeStyle='#0008';g.strokeText(s,x,y);g.fillStyle=col||'#fff';g.fillText(s,x,y)}
function draw(){g.fillStyle='#4a9a3c';g.fillRect(0,0,W,H);
 g.strokeStyle='#d9b878';g.lineWidth=58;g.lineJoin='round';g.lineCap='round';g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();
 g.strokeStyle='#e8cd90';g.lineWidth=42;g.stroke();
 for(const [x,y] of trees){g.fillStyle='#2c6b2a';g.beginPath();g.moveTo(x,y-26);g.lineTo(x+15,y+8);g.lineTo(x-15,y+8);g.fill();g.fillStyle='#235a22';g.beginPath();g.moveTo(x,y-14);g.lineTo(x+18,y+16);g.lineTo(x-18,y+16);g.fill()}
 g.fillStyle='#8a5a2b';g.fillRect(160,566,80,30);g.fillStyle='#c24b3a';g.fillRect(155,552,90,18);
 for(const k of tiles)if(!k.b){g.setLineDash([8,6]);g.strokeStyle='#fff';g.lineWidth=3;g.strokeRect(k.x-26,k.y-26,52,52);g.setLineDash([]);g.fillStyle='#10351c99';g.fillRect(k.x-26,k.y-26,52,52);coin(k.x-12,k.y,9);txt(k.c,k.x+10,k.y+8,20)}
 for(const c of coins)coin(c.x,c.y,7);
 for(const o of tw){g.fillStyle='#7a4a24';g.fillRect(o.x-16,o.y-6,32,30);g.fillStyle='#a86a34';g.fillRect(o.x-20,o.y-16,40,14);g.fillStyle='#e4572e';g.fillRect(o.x-6,o.y-26,12,12)}
 for(const e of en){g.fillStyle=e.hit>0?'#fff':'#e9e6da';g.beginPath();g.ellipse(e.x,e.y+4,8,11,0,0,7);g.fill();g.beginPath();g.arc(e.x,e.y-10,8,0,7);g.fill();g.fillStyle='#222';g.fillRect(e.x-4,e.y-12,3,4);g.fillRect(e.x+1,e.y-12,3,4)}
 for(const s of shots){g.strokeStyle='#ffe27a';g.lineWidth=3;g.beginPath();g.moveTo(s.a,s.b);g.lineTo(s.c,s.d);g.stroke()}
 g.fillStyle='#0004';g.beginPath();g.ellipse(king.x,king.y+16,14,6,0,0,7);g.fill();g.fillStyle='#c0392b';g.fillRect(king.x-10,king.y-6,20,22);g.fillStyle='#f4c9a0';g.beginPath();g.arc(king.x,king.y-12,9,0,7);g.fill();g.fillStyle='#f2c230';g.fillRect(king.x-9,king.y-24,18,7);
 if(joy){g.strokeStyle='#fff9';g.lineWidth=3;g.beginPath();g.arc(joy.o.x,joy.o.y,40,0,7);g.stroke();g.fillStyle='#fff7';g.beginPath();g.arc(joy.o.x+Math.max(-40,Math.min(40,joy.p.x-joy.o.x)),joy.o.y+Math.max(-40,Math.min(40,joy.p.y-joy.o.y)),16,0,7);g.fill()}
 if(!started){const a=t*2.2,hx=180+Math.cos(a)*34,hy=520+Math.sin(a)*34;g.strokeStyle='#fff9';g.lineWidth=3;g.beginPath();g.arc(180,520,40,0,7);g.stroke();g.fillStyle='#fffd';g.beginPath();g.arc(hx,hy,16,0,7);g.fill();txt('DRAG TO MOVE',180,590,22)}
 g.fillStyle='#000a';g.fillRect(10,10,92,32);coin(26,26,9);txt(gold,86,34,22,'#fff','right');
 g.fillStyle='#000a';g.fillRect(250,10,100,32);txt('Wave '+Math.min(wave,3)+'/3',300,34,18);
 for(let i=0;i<5;i++){g.fillStyle=i<base?'#e64a4a':'#5558';g.fillRect(130+i*20,14,16,16)}
 if(flash>0){g.fillStyle='rgba(255,255,255,'+flash*.5+')';g.fillRect(0,0,W,H)}}
function coin(x,y,r){g.fillStyle='#f2a900';g.beginPath();g.arc(x,y,r,0,7);g.fill();g.fillStyle='#ffd84a';g.beginPath();g.arc(x,y,r*.7,0,7);g.fill()}
let last=performance.now();function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(!over)step(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
