const W=360,H=640,cv=document.createElement('canvas');let g=cv.getContext('2d');document.body.appendChild(cv);

function fit(){S=Math.min(innerWidth/W,innerHeight/H);const d=Math.min(devicePixelRatio||1,2);cv.style.cssText=`position:absolute;width:${W*S}px;height:${H*S}px;left:${(innerWidth-W*S)/2}px;top:${(innerHeight-H*S)/2}px`;cv.width=W*S*d;cv.height=H*S*d;g.setTransform(S*d,0,0,S*d,0,0)}

let AC=null;
function tone(f,dur,del,type,vol,f2){if(!AC)return;const t=AC.currentTime+(del||0),o=AC.createOscillator(),v=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);v.gain.setValueAtTime(vol||.12,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+dur+.02)}

function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

 {const w=g.measureText(t).width+size*.3,m=Math.max(60,2*Math.min(x,360-x)-16)/(sc||1);if(w>m)g.scale(m/w,m/w)}// texte trop large : réduit pour tenir dans l'écran (19/11)

 if(press>.15){g.save();g.globalAlpha=.85*press;g.strokeStyle='#fff';g.lineWidth=4*k;g.beginPath();g.arc(x,y,(10+press*16)*k,0,7);g.stroke();

function K_start(cfg){CFG=cfg;bokeh=[...Array(14)].map(()=>({x:Math.random()*W,y:Math.random()*H,r:20+Math.random()*50,v:4+Math.random()*8}));buildDom();
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/S,(e.clientY-r.top)/S]};let isDown=false;

 if(t==0){g.fillStyle=shade(x,y,r,'#ff7a7a','#c8142b');g.beginPath();g.moveTo(x,y-r*.62);g.bezierCurveTo(x+r*.6,y-r*1.05,x+r*1.12,y-r*.4,x+r*.95,y+r*.25);g.bezierCurveTo(x+r*.8,y+r*.85,x+r*.35,y+r*1.02,x,y+r*.82);g.bezierCurveTo(x-r*.35,y+r*1.02,x-r*.8,y+r*.85,x-r*.95,y+r*.25);g.bezierCurveTo(x-r*1.12,y-r*.4,x-r*.6,y-r*1.05,x,y-r*.62);g.fill();g.stroke();
  g.strokeStyle='#6b3b16';g.lineWidth=2.5;g.beginPath();g.moveTo(x,y-r*.6);g.quadraticCurveTo(x+r*.05,y-r*.95,x+r*.15,y-r*1.05);g.stroke();leaf(x+r*.1,y-r*.85,r,-.5);shine(x,y,r)}
 if(t==1){g.fillStyle=shade(x,y,r,'#ffc266','#f07b00');circ(x,y,r*.92);g.fill();g.stroke();g.fillStyle='rgba(180,80,0,.25)';for(let i=0;i<9;i++){circ(x+Math.cos(i*2.4)*r*.55,y+Math.sin(i*2.4)*r*.5,1.3);g.fill()}leaf(x,y-r*.85,r,-.3);shine(x,y,r)}
 if(t==2){g.save();g.translate(x,y);g.rotate(-.5);g.fillStyle=shade(0,0,r,'#fff38a','#e9c400');g.beginPath();g.ellipse(0,0,r,r*.72,0,0,7);g.fill();g.stroke();g.beginPath();g.ellipse(r*.98,0,r*.16,r*.12,0,0,7);g.fill();g.stroke();g.restore();shine(x,y,r*.9)}

  const cs=['#fff','#4cc3ff','#ffd23f','#7dffb2'];for(let i=0;i<10;i++){const a=i*.63,q=r*(.5+(i%3)*.1);g.save();g.translate(x+Math.cos(a)*q,y+Math.sin(a)*q);g.rotate(a*3);g.fillStyle=cs[i%4];g.fillRect(-3,-1,6,2.4);g.restore()}
  g.fillStyle='#3b1d5a';circ(x,y,r*.28);g.fill();g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(x-r*.4,y-r*.45,r*.2,r*.1,-.6,0,7);g.fill()}
 if(t==4){const P=[[0,.55],[-.36,.2],[.36,.2],[-.55,-.2],[0,-.18],[.55,-.2],[-.28,-.55],[.28,-.55]];for(const[a,b]of P){g.fillStyle=shade(x+a*r,y+b*r,r*.34,'#d39bff','#7a2fd0');circ(x+a*r,y+b*r,r*.33);g.fill();g.stroke()}
  for(const[a,b]of P){g.fillStyle='rgba(255,255,255,.5)';circ(x+a*r-r*.1,y+b*r-r*.1,r*.08);g.fill()}leaf(x,y-r*.82,r,-.9)}

const N=7,CS=38,GX=(360-N*CS)/2,GY=158,GOAL=5;
const BC=['#4c8dff','#ff5a6a','#3ddc84','#ffb020','#b06cff'];
const SH={o:[[0,0],[0,1],[1,0],[1,1]],i3:[[0,0],[0,1],[0,2]],v2:[[0,0],[1,0]],l:[[0,0],[1,0],[1,1]],i4:[[0,0],[0,1],[0,2],[0,3]]};
const rn=rng(5);let board=[...Array(N)].map(()=>Array(N).fill(-1)),lines=0,drag=null,carry=null,placed=0,flashL=[];
const gaps=new Set(['2,6','3,6','4,4','4,5','5,4','5,5','6,1','6,2','6,3']);
for(let r=2;r<N;r++)for(let c=0;c<N;c++)if(!gaps.has(r+','+c))board[r][c]=Math.floor(rn()*5);
const tray=[{s:'o',col:0},{s:'i3',col:1},{s:'v2',col:2}].map((o,i)=>({...o,cells:SH[o.s],i,used:false,x:60+i*120,y:520,sc:0,app:.2+i*.1}));
const bw=p=>Math.max(...p.cells.map(q=>q[1]))+1,bh=p=>Math.max(...p.cells.map(q=>q[0]))+1;
function fits(p,r,c){return p.cells.every(([a,b])=>{const y=r+a,x=c+b;return y>=0&&x>=0&&y<N&&x<N&&board[y][x]<0})}
function anchor(p,cx,cy){return{r:Math.round((cy-bh(p)*CS/2-GY)/CS),c:Math.round((cx-bw(p)*CS/2-GX)/CS)}}
function full(b){const rs=[],cs=[];for(let i=0;i<N;i++){if(b[i].every(v=>v>=0))rs.push(i);if(b.every(row=>row[i]>=0))cs.push(i)}return{rs,cs}}
function sim(p,r,c){const b=board.map(x=>x.slice());p.cells.forEach(([a,k])=>b[r+a][c+k]=1);const f=full(b);return f.rs.length+f.cs.length}
function bestMove(){let m=null,s=-1;for(const p of tray)if(!p.used)for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fits(p,r,c)){const v=sim(p,r,c)*10-r*.01;if(v>s){s=v;m={p,r,c}}}return m}
function block(x,y,s,col){g.fillStyle='rgba(0,0,0,.25)';rr(x+1,y+3,s-2,s-2,7);g.fill();g.fillStyle=BC[col];rr(x+1,y+1,s-2,s-2,7);g.fill();g.fillStyle='rgba(255,255,255,.35)';rr(x+5,y+4,s-10,6,3);g.fill()}
function place(p,r,c){p.used=true;p.cells.forEach(([a,k])=>board[r+a][c+k]=p.col);placed++;snd('drop');
 const f=full(board);const n=f.rs.length+f.cs.length;
 if(n){lines+=n;snd('match',n);f.rs.forEach(i=>{for(let k=0;k<N;k++){burst(GX+k*CS+CS/2,GY+i*CS+CS/2,[BC[board[i][k]],'#fff'],3,150)}flashL.push({r:i,t0:T})});
  f.cs.forEach(i=>{for(let k=0;k<N;k++)burst(GX+i*CS+CS/2,GY+k*CS+CS/2,[BC[board[k][i]],'#fff'],3,150);flashL.push({c:i,t0:T})});
  f.rs.forEach(i=>board[i].fill(-1));f.cs.forEach(i=>{for(let k=0;k<N;k++)board[k][i]=-1});
  pop(n>1?'COMBO x'+n+'!':PRAISE[Math.min(lines-1,5)],180,GY+N*CS/2,{big:n>1,size:n>1?34:28,tag:'l'});
  if(lines>=GOAL){snd('win');finish(true,1.8)}}
 if(tray.every(q=>q.used)&&!over)after(.2,()=>{['l','v2','i4'].forEach((s,i)=>{const q=tray[i];q.s=s;q.cells=SH[s];q.col=(i+3)%5;q.used=false;q.sc=0;q.app=.05+i*.1})})}
const GAME={
 frame(dt){
  g.fillStyle='rgba(10,20,60,.35)';rr(GX-8,GY-2,N*CS+16,N*CS+14,18);g.fill();g.fillStyle='#e9eeff';rr(GX-8,GY-8,N*CS+16,N*CS+14,18);g.fill();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){g.fillStyle=(r+c)%2?'#dbe3fb':'#cfd9f7';g.fillRect(GX+c*CS,GY+r*CS,CS,CS)}
  let pv=null;if(drag){const a=anchor(drag,drag.x,drag.y-50);if(fits(drag,a.r,a.c))pv=a}
  if(pv){g.globalAlpha=.4;drag.cells.forEach(([a,k])=>block(GX+(pv.c+k)*CS,GY+(pv.r+a)*CS,CS,drag.col));g.globalAlpha=1}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]>=0)block(GX+c*CS,GY+r*CS,CS,board[r][c]);
  for(let i=flashL.length-1;i>=0;i--){const f=flashL[i],k=(T-f.t0)/.4;if(k>=1){flashL.splice(i,1);continue}g.globalAlpha=1-k;g.fillStyle='#fff';if(f.r!=null)g.fillRect(GX,GY+f.r*CS,N*CS,CS);else g.fillRect(GX+f.c*CS,GY,CS,N*CS);g.globalAlpha=1}
  if(carry){const k=ease(cl((T-carry.t0-.15)/.7));drag.x=lerp(carry.x1,carry.x2,k);drag.y=lerp(carry.y1,carry.y2,k)}
  tray.forEach(p=>{if(p.used){return}if(p.app>0){p.app-=dt;return}p.sc=Math.min(1,p.sc+dt*5);if(p==drag)return;const s=.62*back(p.sc),w=bw(p)*CS*s,h=bh(p)*CS*s;p.cells.forEach(([a,k])=>block(p.x-w/2+k*CS*s,p.y-h/2+a*CS*s,CS*s,p.col))});
  if(drag){const w=bw(drag)*CS,h=bh(drag)*CS;drag.cells.forEach(([a,k])=>block(drag.x-w/2+k*CS,drag.y-50-h/2+a*CS,CS,drag.col))}
  g.fillStyle='rgba(10,20,60,.3)';rr(24,102,312,0,0);
  for(let i=0;i<GOAL;i++){const x=180+(i-(GOAL-1)/2)*36;g.fillStyle=i<lines?'#ffd23f':'rgba(255,255,255,.25)';star(x,448,14);g.fill()}
  outText('LINES '+Math.min(lines,GOAL)+'/'+GOAL,180,474,14,'#fff')},
 down(x,y){if(carry)return;for(const p of tray)if(!p.used&&p.app<=0&&Math.abs(x-p.x)<62&&Math.abs(y-p.y)<46){drag=p;p.x=x;p.y=y;snd('pick');return}},
 move(x,y){if(drag&&!carry){drag.x=x;drag.y=y}},
 up(x,y){if(!drag||carry)return;const p=drag;drag=null;const a=anchor(p,x,y-50);if(fits(p,a.r,a.c))place(p,a.r,a.c);else{snd('fail');p.x=60+p.i*120;p.y=520}},
 hint(){if(drag||carry)return null;const m=bestMove();if(!m)return null;return{x1:m.p.x,y1:m.p.y,x2:GX+(m.c+bw(m.p)/2)*CS,y2:GY+(m.r+bh(m.p)/2)*CS+50,label:'DRAG BLOCKS TO FILL LINES!'}},
 auto(){if(carry||drag)return true;const m=bestMove();if(!m)return false;const p=m.p,tx=GX+(m.c+bw(p)/2)*CS,ty=GY+(m.r+bh(p)/2)*CS+50;drag=p;carry={x1:p.x,y1:p.y,x2:tx,y2:ty,t0:T};ghost=null;snd('pick');
  after(.95,()=>{carry=null;drag=null;place(p,m.r,m.c);p.x=60+p.i*120;p.y=520});return true}};
K_start({name:'BLOCK SLIDE',level:18,hook:['FILL THE LINES!','DRAG BLOCKS TO CLEAR 5 LINES',38,20],help:'DRAG BLOCKS TO FILL LINES!',winMsg:'Lines cleared! Ready for Level 19?',loseMsg:'So close! Try again?',
 bg:['#7fb0ff','#3a62d8','#101a52'],ink:'#101a52',accent:'#ffe066',logo:['#9fc4ff','#3a62d8'],maxTime:50,url:'https://play.google.com/store',small:'Free to play',
 drawLogo(){block(28,28,36,0);block(64,28,36,1);block(28,64,36,2);block(64,64,36,3)}});
</script></body></html>
