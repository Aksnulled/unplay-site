function ok(a,b){return a.v==b.v||a.v+b.v==10}
function linked(L,i,j){if(i>j)[i,j]=[j,i];let f=true;for(let k=i+1;k<j;k++)if(!L[k].gone){f=false;break}if(f)return true;
 const ri=Math.floor(i/NW),ci=i%NW,rj=Math.floor(j/NW),cj=j%NW,dr=rj-ri,dc=cj-ci;if(!dr)return false;

function allPairs(L){const out=[];for(let i=0;i<L.length;i++)if(!L[i].gone)for(let j=i+1;j<L.length;j++)if(!L[j].gone&&ok(L[i],L[j])&&linked(L,i,j))out.push([i,j]);return out}
function rowsDone(L){const out=[];for(let r=0;r*NW<L.length;r++)if(L.slice(r*NW,r*NW+NW).every(c=>c.gone))out.push(r);return out}
function bestPair(L){let best=null,bs=-1;for(const[i,j]of allPairs(L)){L[i].gone=L[j].gone=true;let s=rowsDone(L).length*100;
 for(const r of[Math.floor(i/NW),Math.floor(j/NW)])s+=L.slice(r*NW,r*NW+NW).filter(c=>c.gone).length;L[i].gone=L[j].gone=false;if(s>bs){bs=s;best=[i,j]}}return best}
function sim(L){let n=0,r=0;while(n<14){const p=bestPair(L);if(!p)break;L[p[0]].gone=L[p[1]].gone=true;n++;const d=rowsDone(L);for(const k of d.reverse())L.splice(k*NW,NW);r+=d.length;if(r>=GOALR)return n}return 0}
function make(seed){const rnd=rng(seed);return[...Array(NW*5)].map(()=>({v:1+Math.floor(rnd()*9),gone:rnd()<.38}))}
{let s=1,n;while(true){n=sim(make(s));if(n>=7&&n<=10)break;s++}cells=make(s)}
